BveTs Vehicle Sound 3.00

; LIRR M7 — generated by tools/gen_m7_sounds.py.  Do not hand-edit.
; Values are lowercased by MTR and become sound ids of the form
;   station_announcer:m7_<value>   e.g. station_announcer:m7_motor0

[MTR]
MotorNoiseDataType = 5
MotorVolumeMultiply = 1
DoorCloseSoundLength = 1
BreakerDelay = 0.25
MotorOutputAtCoast = 0
RegenerationLimit = 2.2

; Pitched and mixed from {power,brake}{vol,freq}.csv against speed in km/h.
[Motor]
0 = motor0.wav
1 = motor1.wav
2 = motor2.wav
3 = motor3.wav
4 = motor4.wav

; Rolling noise. MTR drives pitch and volume from speed directly (v_ms * 0.04),
; so run0 is authored to sit at pitch 1.0 at 25 m/s.
[Run]
0 = run0.wav

; One shot as each bogie passes a rail node.
[Switch]
0 = point.wav

; Curve squeal. NOTE: MTR 4.0.5 plays the flange loop at volume 0 unconditionally.
[Flange]
0 = flange0.wav

[Brake]
BC Release = air.wav
BC Release Full = airzero.wav
BC Release High = airhigh.wav
Emergency = emrbrake.wav

[BrakeHandle]
Apply = brake_apply.wav
Release = brake_release.wav

[Compressor]
Attack = cp_start.wav
Loop = cp_loop.wav
Release = cp_end.wav

[Door]
Open = dooropn.wav
Close = doorcls.wav

[Others]
Noise = loop.wav
Shoe = rub.wav
